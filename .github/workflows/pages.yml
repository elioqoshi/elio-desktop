name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # index.html inlines everything but photos/ and wallpapers/; LICENSES ships alongside the inlined font.
      # dither.py only redoes photos and wallpapers that were added without being dithered locally
      - run: |
          pip install -r requirements.txt
          python3 tools/dither.py
          python3 build.py
          mkdir _site
          cp -r index.html LICENSES photos _site/
          mkdir -p _site/wallpapers _site/assets && cp -r wallpapers/*.png wallpapers/view wallpapers/thumbs _site/wallpapers/ && cp assets/wallpaper-ghosts.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
